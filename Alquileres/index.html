<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2310b981'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-family='system-ui,sans-serif' font-size='20' font-weight='800' fill='%230f172a'%3EG%3C/text%3E%3C/svg%3E">
  <title>Gestor de Alquileres - Iniciar Sesión</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=12.0">
</head>

<body>

  <!-- LOGIN -->
  <div id="login" class="login-split-layout">
    <!-- Panel Izquierdo: Formulario -->
    <div class="login-form-side">
      <div class="lbox" style="box-shadow: none; border: none; background: transparent; padding: 20px; width: 100%; max-width: 340px;">
        <div class="llogo">GestorAlquileres</div>
        <div class="lsub">// franquicias · contratos · vencimientos</div>
        
        <form onsubmit="event.preventDefault(); doLogin();" style="display:flex; flex-direction:column; gap:12px;">
          <div class="fg">
            <label>Usuario o Email</label>
            <input type="text" id="lu" placeholder="admin o email@..." autocomplete="username">
          </div>
          <div class="fg">
            <label>Contraseña</label>
            <input type="password" id="lp" placeholder="••••" autocomplete="current-password">
          </div>
          <button type="submit" class="lbtn">ENTRAR AL SISTEMA →</button>
        </form>
        <div class="lerr" id="lerr"></div>
        <div style="margin-top:14px;font-family:var(--fm);font-size:10px;color:var(--t4);text-align:center;">
          Acceso Directo (Uso Personal)
        </div>
      </div>
    </div>
    
    <!-- Panel Derecho: Decorativo Industrial -->
    <div class="login-decor-side">
      <div class="decor-content">
        <div class="decor-tag">// SISTEMA DE GESTIÓN FRACCIONAL v3.0</div>
        <div class="decor-title">GESTOR<br>ALQUILERES</div>
      </div>
    </div>
  </div>

  <!-- Scripts de inicio -->
  <script src="app.js?v=100.0"></script>
</body>

</html>
